<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Media Queries</title>
    <style>
      /* Mobile First Design */
      body {
        background-color: #d3a4e8;
      }

      h1,
      h2 {
        color: #8d5ea3;
        text-align: center;
      }

      /* Tablet and Desktop Design */
      @media screen and (min-width: 700px) {
        body {
          background-color: #e8458c;
        }

        h1,
        h2 {
          color: #b92666;
        }
      }

      @media screen and (min-width: 900px) {
        body {
          background-color: #3e529b;
        }

        h1,
        h2 {
          color: #273772;
        }
      }

      @media screen and (min-width: 1200px) {
        body {
          background-color: #fff;
        }

        h1,
        h2 {
          color: rgb(208, 198, 198);
        }
      }
    </style>
  </head>
  <body>
    <h1>Media Queries</h1>
    <h2>Evony Campos</h2>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Header</title>

    <style>
      /* Mobile First Design */

      body {
        background-color: #000;
        margin: 0;
        padding: 0;
      }
      #pageheader {
        background-color: #e42978;
        padding: 1rem;
        border-bottom: 1px solid #be1c60;
      }

      #logo {
        height: 100px;
        width: 130px;
        background: #e281a4;
        border-radius: 50%;
        border: 2px solid #cf6b90;
        margin: auto;
        margin-bottom: 1rem;
        display: block;
      }

      #pageheader nav {
        background-color: #361124;
        padding: 1rem;
        border-radius: 1rem;
      }

      #pageheader ul {
        list-style-type: none;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }

      #pageheader li {
        text-align: center;
        padding: 1rem;
        border: 3px solid #802554;
        color: white;
        border-radius: 10px;
        background-color: #b42971;
      }

      #GIF {
        position: fixed;
        bottom: 30px;
        left: 100%;
      }

      /* Table and Desktop Design */
      @media screen and (min-width: 700px) {
        #pageheader {
          display: flex;
          justify-content: space-between;
        }

        #logo {
          margin: 0;
        }

        #pageheader ul {
          display: flex;
          flex-direction: row;
        }
      }

      #GIF {
        position: fixed;
        bottom: 30px;
        left: 70%;
      }
    </style>
  </head>
  <body>
    <img
      height="100px"
      id="GIF"
      src="Images/87f0d438c39f249eaaf0a7d9dd006808.gif"
      alt="Draculaura GIF"
    />
    <header id="pageheader">
      <img
        id="logo"
        src="Images/Monster-High-Logo-2010.png"
        alt="Monster High Skull Logo 2010"
      />
      <nav>
        <ul>
          <li>Home</li>
          <li>Why Adopt</li>
          <li>Pet Gallery</li>
          <li>Testimonials</li>
        </ul>
      </nav>
    </header>
  </body>
</html>
